name: Build iOS Tweak

on:
  workflow_dispatch:
  push:
    paths:
      - 'Tweak.x'
      - 'Makefile'
      - 'control'

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 20
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Install Theos
        run: |
          git clone --depth=1 https://github.com/theos/theos.git ~/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV
          echo "$HOME/theos/bin" >> $GITHUB_PATH
      
      - name: Install dependencies
        run: |
          brew untap aws/tap || true
          brew install ldid dpkg
      
      - name: Build tweak
        run: |
          make clean
          make package
      
      - name: Upload dylib
        uses: actions/upload-artifact@v4
        with:
          name: botcczz.dylib
          path: botcczz.dylib
          retention-days: 30
      
      - name: Upload .deb package
        uses: actions/upload-artifact@v4
        with:
          name: botcczz.deb
          path: .theos/packages/*.deb
          retention-days: 30
