name: Build iOS Tweak

on:
  workflow_dispatch:
  push:
    paths:
      - 'Tweak.x'
      - 'Makefile'
      - 'control'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git make perl clang dpkg-dev xz-utils curl ca-certificates
          curl -fL -o /tmp/ldid https://github.com/ProcursusTeam/ldid/releases/download/v2.1.5-procursus7/ldid_linux_x86_64
          sudo install -m 755 /tmp/ldid /usr/local/bin/ldid
          ldid -h || true

      - name: Install Theos
        run: |
          git clone --depth=1 --recurse-submodules https://github.com/theos/theos.git "$HOME/theos"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"
          echo "$HOME/theos/bin" >> "$GITHUB_PATH"
          git clone --depth=1 https://github.com/theos/sdks.git /tmp/theos-sdks
          cp -a /tmp/theos-sdks/. "$HOME/theos/sdks/"

      - name: Show project files
        run: |
          pwd
          ls -la
          find . -maxdepth 3 -type f | sort

      - name: Build tweak
        run: |
          make clean
          make package FINALPACKAGE=1

      - name: Upload build output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TelegramMenuTweak-build
          path: |
            .theos/obj/**/*.dylib
            .theos/packages/*.deb
            *.dylib
          if-no-files-found: warn
          retention-days: 30
